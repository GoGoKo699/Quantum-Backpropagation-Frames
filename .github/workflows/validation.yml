name: Repository validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            figures/requirements.txt
      - name: Install validation dependencies and supported package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
      - name: Choose bounded validation scope
        id: scope
        shell: bash
        run: echo "mode=$(python tools/validate.py --ci-mode)" >> "$GITHUB_OUTPUT"
      - name: Validate current tree (full mode includes tools/integration_check.py)
        run: python tools/validate.py --mode ${{ steps.scope.outputs.mode }} --output runs/validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/validation/
          if-no-files-found: warn
          retention-days: 30
