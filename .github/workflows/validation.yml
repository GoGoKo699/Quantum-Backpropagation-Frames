name: Integration and evidence checks
on:
  push:
    branches: [main, 'review/**', 'research/PF-04-boundary']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/integration_check.py --output runs/integration
      - name: Verify PF-04 packet identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('results/PF-04')
          for name, expected in json.loads((root/'MANIFEST.json').read_text())['sha256'].items():
              actual = hashlib.sha256((root/name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'PF-04 file identity mismatch: {name}')
          print('All nine PF-04 packet file hashes verified')
          PY
      - name: Execute PF-04 finite diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python results/PF-04/study.py --output runs/pf04-study | tee runs/pf04-study.log
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/
          if-no-files-found: error
          retention-days: 30
